name: Release

# Builds, signs, notarizes and drafts a release for a version tag, such as
# v0.1.0 or v0.1.0-alpha.1. A tag with a suffix is drafted as a pre-release.
# Nothing reaches users until the draft is reviewed and published; publishing
# runs update-feed.yml, which adds the release to the update feed.
#
# Repository secrets (see docs/RELEASING.md):
#   DEVELOPER_ID_P12           base64 of the Developer ID Application certificate (.p12)
#   DEVELOPER_ID_P12_PASSWORD  its password
#   APPLE_TEAM_ID              the team the certificate belongs to
#   NOTARY_API_KEY_P8          base64 of an App Store Connect API key (.p8)
#   NOTARY_API_KEY_ID          its key ID
#   NOTARY_API_ISSUER_ID       its issuer ID

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, such as v0.1.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      TAG: ${{ inputs.tag || github.ref_name }}
      REPOSITORY_URL: https://github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Version
        run: |
          version="${TAG#v}"
          marketing=$(xcodebuild -project Inky.xcodeproj -scheme Inky -showBuildSettings -configuration Release \
            | awk -F' = ' '/ MARKETING_VERSION = /{print $2; exit}')
          # The tag of a pre-release, such as v0.1.0-alpha.1, carries the
          # numeric version in front.
          if [ "${version%%-*}" != "$marketing" ]; then
            echo "::error::Tag $TAG does not match MARKETING_VERSION $marketing"; exit 1
          fi
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          # Sparkle compares build numbers, across both update channels. The
          # count of commits only grows on main.
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag $TAG is not on main, so its build number could go backwards"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "PRERELEASE=$prerelease" >> "$GITHUB_ENV"

      - name: Check the update key is set
        run: |
          key=$(xcodebuild -project Inky.xcodeproj -scheme Inky -showBuildSettings -configuration Release \
            | awk -F' = ' '/ INKY_UPDATE_PUBLIC_KEY = /{print $2; exit}')
          if [ -z "$key" ]; then
            echo "::error::INKY_UPDATE_PUBLIC_KEY is empty, so the release could not update itself"; exit 1
          fi

      - name: Import the signing certificate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # The app carries the whole version, such as 0.1.0-alpha.1, so that
          # About and the update window tell pre-releases apart, and so that a
          # pre-release starts on the beta update channel.
          xcodebuild archive -project Inky.xcodeproj -scheme Inky -configuration Release \
            -derivedDataPath build -archivePath "$RUNNER_TEMP/Inky.xcarchive" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$TEAM_ID" OTHER_CODE_SIGN_FLAGS=--timestamp
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>developer-id</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM_ID</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Inky.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/export/Inky.app"
          plist="$RUNNER_TEMP/export/Inky.app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" = "$BUILD"

      - name: Notarize
        env:
          API_KEY: ${{ secrets.NOTARY_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          echo "$API_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          ditto -c -k --keepParent "$RUNNER_TEMP/export/Inky.app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" --wait
          rm "$RUNNER_TEMP/notary.p8"
          xcrun stapler staple "$RUNNER_TEMP/export/Inky.app"
          spctl --assess --type execute --verbose "$RUNNER_TEMP/export/Inky.app"

      - name: Archive for download
        run: |
          mkdir -p dist
          archive="Inky-$VERSION.zip"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/export/Inky.app" "dist/$archive"
          (cd dist && shasum -a 256 "$archive" > "$archive.sha256")
          # This version's section of the changelog, as the release notes.
          # update-feed.yml shows the published release's notes in Sparkle's
          # update window, so edits to the draft's notes reach it too.
          # GitHub shows each line break of release notes, so the changelog's
          # wrapped lines are joined into whole paragraphs and list items.
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1 || $0 == "## " v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md | awk '
            function flush() { if (buf != "") print buf; buf = "" }
            /^```/ { flush(); print; fence = !fence; next }
            fence { print; next }
            /^[[:space:]]*$/ { flush(); print; next }
            /^(#|>|\|)/ || /^[[:space:]]*([-*+]|[0-9]+\.)[[:space:]]/ { flush(); buf = $0; next }
            { line = $0; sub(/^[[:space:]]+/, "", line); buf = (buf == "") ? line : buf " " line }
            END { flush() }
          ' > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; }
          ls -la dist

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--draft --verify-tag --title "Inky $VERSION" --notes-file "$RUNNER_TEMP/notes.md")
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* "${flags[@]}"

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
